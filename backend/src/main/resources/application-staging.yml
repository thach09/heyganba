spring:
  config:
    activate:
      on-profile: staging
  jpa:
    show-sql: false

  flyway:
    # Giữ tương thích với database staging đã có lịch sử migration mang số phiên bản cao hơn V10.
    # Cờ chỉ cho phép Flyway áp dụng migration còn thiếu phía sau lịch sử đó; không thay thế việc
    # xem xét nội dung migration. Database mới vẫn chạy migration theo thứ tự phiên bản.
    out-of-order: true

logging:
  level:
    root: INFO
    com.heyganba: INFO
