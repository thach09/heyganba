spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

  flyway:
    # PRODUCTION & LOCAL nạp toàn bộ giáo trình HSK 1 và HSK 2 đã được thẩm định
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/migration-staging}

management:
  endpoint:
    health:
      # Production không trả chi tiết thành phần hạ tầng cho request ẩn danh.
      show-details: never

logging:
  level:
    root: WARN
    com.heyganba: INFO
    # Giữ đủ log để vận hành deploy: thấy "Tomcat started on port(s)" (Render route theo PORT),
    # tiến trình Flyway, và trạng thái HikariCP khi kết nối Postgres — trước đây prod để WARN nên
    # deploy treo mà không có manh mối nào trong log.
    org.springframework.boot: INFO
    org.flywaydb: INFO
    com.zaxxer.hikari: INFO
