spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

  flyway:
    # PRODUCTION chỉ chạy migration đã duyệt — KHÔNG include `db/migration-staging` (nội dung chờ duyệt tiếng Nhật).
    # Muốn promote nội dung đang chờ: chuyển file từ `db/migration-staging/` sang `db/migration/` sau khi có review.
    locations: classpath:db/migration

management:
  endpoint:
    health:
      # Production không trả chi tiết thành phần hạ tầng cho request ẩn danh.
      show-details: never

logging:
  level:
    root: WARN
    com.heyganba: INFO
    # Giữ đủ log để vận hành deploy: thấy "Tomcat started on port(s)" (Render route theo PORT),
    # tiến trình Flyway, và trạng thái HikariCP khi kết nối Postgres — trước đây prod để WARN nên
    # deploy treo mà không có manh mối nào trong log.
    org.springframework.boot: INFO
    org.flywaydb: INFO
    com.zaxxer.hikari: INFO
