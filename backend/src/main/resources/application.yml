server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  # Render/Vercel chạy sau reverse proxy: cần đọc X-Forwarded-* để nhận đúng scheme/host (HTTPS).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: heyganba-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:heyganba}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 600000 # 10 minutes
      connection-timeout: 30000 # 30 seconds
      max-lifetime: 1800000 # 30 minutes
      pool-name: HeyGanbaHikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    # `db/migration` = migration đã duyệt (chạy ở MỌI môi trường, kể cả production).
    # `db/migration-staging` = nội dung CHỜ DUYỆT, chỉ chạy ở local/staging (application-prod.yml KHÔNG include thư mục này).
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/migration-staging}

  # Redis (Phase 2/5): chỉ được dùng khi app.srs.cache=redis. mặc định memory nên Redis không bắt buộc.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

app:
  jwt:
    # Ở staging/production PHẢI set biến môi trường JWT_SECRET (chuỗi Base64 ≥ 32 byte sau khi decode).
    # - Render Blueprint: đã đặt `generateValue: true` → Render tự sinh secret, KHÔNG cần thao tác tay.
    # - Tạo Web Service thủ công: dán giá trị `openssl rand -base64 48`.
    # Để default rỗng có chủ đích: app vẫn fail-fast lúc khởi động nhưng với thông báo rõ ràng
    # (JwtTokenProvider ném lỗi hướng dẫn) thay vì PlaceholderResolutionException khó đọc.
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000} # 30 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  # "Ngày học" dùng chung cho streak + heatmap + refresh cache SRS due (quyết định đã chốt):
  #  - Một ngày chỉ được tính streak khi: ôn >= app.streak.min-srs-reviews lượt SRS, HOẶC nộp 1 lượt thi thử,
  #    HOẶC làm >= app.streak.min-quiz-questions câu bài tập ngữ pháp (ôn 1 từ đơn lẻ KHÔNG tính).
  #  - Múi giờ mặc định Asia/Ho_Chi_Minh (giờ VN) ở MỌI môi trường local/staging/production.
  streak:
    zone: ${APP_STREAK_ZONE:Asia/Ho_Chi_Minh}
    min-srs-reviews: ${APP_STREAK_MIN_SRS_REVIEWS:10}
    min-quiz-questions: ${APP_STREAK_MIN_QUIZ_QUESTIONS:10}
  srs:
    # Cache danh sách từ cần ôn: memory (ĐANG DÙNG ở mọi môi trường — quyết định: chưa bật Redis vì chưa có
    # managed instance) | redis (implementation đã viết sẵn trong RedisSrsDueCache, chỉ cần đổi biến này khi có Redis).
    cache: ${APP_SRS_CACHE:memory}
    # Job xoá cache chạy theo múi giờ "ngày học" ở trên (00:05 giờ VN), không theo giờ server (thường UTC).
    cache-sync-cron: ${APP_SRS_CACHE_SYNC_CRON:0 5 0 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
