name: HeyGanba CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

# Huỷ run cũ khi có push mới trên cùng branch → tiết kiệm phút CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"

jobs:
  backend-test:
    name: Backend Build & Test (H2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        working-directory: ./backend
        run: mvn -B clean verify

      - name: Verify controlled production artifact
        run: python3 scripts/audit-production-artifact.py --jar backend/target/heyganba-backend-0.0.1-SNAPSHOT.jar --test-rejections

      - name: Audit runtime dependencies
        working-directory: ./backend
        run: |
          mvn -B dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
          python3 tools/audit-runtime-dependencies.py target/runtime-dependencies.txt

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  backend-migration-check:
    name: Backend Migration Check (PostgreSQL + Flyway)
    runs-on: ubuntu-latest
    needs: [backend-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: heyganba_migrationcheck
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heyganba_migrationcheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Chạy thẳng trên PostgreSQL thật: xác nhận Flyway migration apply được và entity khớp schema.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/heyganba_migrationcheck
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Apply Flyway migrations on PostgreSQL and verify schema
        working-directory: ./backend
        run: mvn -B test

      # The full API suite above exercises real writes against PostgreSQL. The
      # opt-in rehearsal additionally needs two empty databases, isolated from it.
      - name: Rehearse historical V11 schema and Hibernate validation
        working-directory: ./backend
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres heyganba_rehearsal_a_ci
          docker exec ${{ job.services.postgres.id }} createdb -U postgres heyganba_rehearsal_b_ci
          mvn -B test -Dtest=PostgresSchemaStagingRehearsalTest \
            -Dpostgres.rehearsal=true \
            -Dpostgres.rehearsal.urlA=jdbc:postgresql://localhost:5432/heyganba_rehearsal_a_ci \
            -Dpostgres.rehearsal.urlB=jdbc:postgresql://localhost:5432/heyganba_rehearsal_b_ci \
            -Dpostgres.rehearsal.user=postgres \
            -Dpostgres.rehearsal.password=postgres

      - name: Rehearse controlled production install, upgrade and interrupted recovery
        working-directory: ./backend
        run: |
          for kind in fresh upgrade failure; do
            docker exec ${{ job.services.postgres.id }} createdb -U postgres heyganba_release_${kind}_ci
          done
          mvn -B test -Dtest=ProductionMigrationSafetyTest \
            -Dpostgres.production-rehearsal=true \
            -Dpostgres.release.fresh=jdbc:postgresql://localhost:5432/heyganba_release_fresh_ci \
            -Dpostgres.release.upgrade=jdbc:postgresql://localhost:5432/heyganba_release_upgrade_ci \
            -Dpostgres.release.failure=jdbc:postgresql://localhost:5432/heyganba_release_failure_ci \
            -Dpostgres.rehearsal.user=postgres \
            -Dpostgres.rehearsal.password=postgres

      - name: Upload PostgreSQL surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend-test:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Test frontend behavior (Node + Vitest)
        working-directory: ./frontend
        run: npm test

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=moderate

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  # Deployment is intentionally outside this recovery workflow. No Render hooks run here.
  # Verify provider Git integrations independently before any push; CI does not prove deployment safety.
