name: Jiayou CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:
    inputs:
      run_legacy_preflight:
        description: Run read-only legacy source-history comparison (never deploys)
        type: boolean
        default: false
      deployed_sha:
        description: Full operator-verified deployed legacy SHA
        type: string
      locations:
        description: Operator-verified effective legacy Flyway locations
        type: string

permissions:
  contents: read

# Huỷ run cũ khi có push mới trên cùng branch → tiết kiệm phút CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"

jobs:
  backend-test:
    name: Backend Build & Test (H2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test production migration preflight
        run: python3 -m unittest discover -s backend/tools/tests -p "test_production_migration_preflight.py" -v

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build and test with Maven
        working-directory: ./backend
        run: mvn -B clean verify

      - name: Audit runtime dependencies
        working-directory: ./backend
        run: |
          mvn -B dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
          python3 tools/audit-runtime-dependencies.py target/runtime-dependencies.txt

      - name: Rehearse retained historical dictionary fixtures separately
        working-directory: ./backend
        run: |
          git fetch --no-tags origin fffcbc924fcbaeda45bf3d3097acc07013954faf
          python3 tools/materialize-legacy-audit.py "${{ runner.temp }}/jiayou-legacy-fixtures"
          mvn -B -Plegacy-japanese-audit test -Dbuild.output.root="${{ runner.temp }}/jiayou-legacy-build" -Dlegacy.audit.resources="${{ runner.temp }}/jiayou-legacy-fixtures"

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  backend-migration-check:
    name: Backend Migration Check (PostgreSQL + Flyway)
    runs-on: ubuntu-latest
    needs: [backend-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: heyganba_migrationcheck
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heyganba_migrationcheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Chạy thẳng trên PostgreSQL thật: xác nhận Flyway migration apply được và entity khớp schema.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/heyganba_migrationcheck
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: "classpath:db/migration,classpath:db/migration-staging"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Apply Flyway migrations on PostgreSQL and verify schema
        working-directory: ./backend
        run: mvn -B test

      # The full API suite above exercises real writes against PostgreSQL. The
      # opt-in rehearsal additionally needs two empty databases, isolated from it.
      - name: Rehearse baseline, full curriculum, and Hibernate validation
        working-directory: ./backend
        run: |
          docker exec ${{ job.services.postgres.id }} createdb -U postgres heyganba_rehearsal_a_ci
          docker exec ${{ job.services.postgres.id }} createdb -U postgres heyganba_rehearsal_b_ci
          mvn -B test -Dtest=PostgresSchemaStagingRehearsalTest \
            -Dpostgres.rehearsal=true \
            -Dpostgres.rehearsal.urlA=jdbc:postgresql://localhost:5432/heyganba_rehearsal_a_ci \
            -Dpostgres.rehearsal.urlB=jdbc:postgresql://localhost:5432/heyganba_rehearsal_b_ci \
            -Dpostgres.rehearsal.user=postgres \
            -Dpostgres.rehearsal.password=postgres

      - name: Upload PostgreSQL surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend-test:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Test frontend behavior (Node + Vitest)
        working-directory: ./frontend
        run: npm test

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=moderate

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  # Preserved PR48 protection. There is deliberately no automatic deployment job.
  backend-production-preflight:
    name: Backend Production Migration Preflight
    needs: [backend-test, backend-migration-check, frontend-test]
    if: github.event_name == 'workflow_dispatch' && inputs.run_legacy_preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify legacy source history without database access
        env:
          PRODUCTION_BACKEND_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          PRODUCTION_FLYWAY_LOCATIONS: ${{ inputs.locations }}
        run: python3 backend/tools/production_migration_preflight.py --candidate-sha "$GITHUB_SHA"
