name: Jiayou isolated bootstrap

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-only-bootstrap:
    name: Jiayou schema-only bootstrap (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Create disposable fixtures in this job's PostgreSQL service
        run: |
          for suffix in a legacy nonempty wrong schema function tampered manifest; do
            docker exec ${{ job.services.postgres.id }} createdb -U postgres jiayou_bootstrap_ci_${suffix}
          done
      - name: Verify bootstrap guards, Hibernate validation and restart invariance
        working-directory: backend
        run: >-
          mvn -B test -Dtest=JiayouBootstrapGuardTest,JiayouBootstrapPostgresTest
          -Djiayou.bootstrap.rehearsal=true
          -Djiayou.bootstrap.url=jdbc:postgresql://127.0.0.1:5432/jiayou_bootstrap_ci_a
          -Djiayou.bootstrap.password=postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jiayou-bootstrap-test-reports
          path: backend/target/surefire-reports/
