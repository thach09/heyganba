# Blueprint Render cho backend HeyGanba (tuỳ chọn).
# - Database được cung cấp riêng; cấu hình JDBC URL và tài khoản qua SPRING_DATASOURCE_*.
# - Các biến `sync: false` phải được khai báo trong Render Dashboard trước khi chạy service.
# - TRUSTED_PROXY_CIDRS phải là CIDR của peer proxy trực tiếp theo tài liệu nhà cung cấp; không dùng dải công cộng.
# - autoDeploy: false vì deploy do GitHub Actions gọi Deploy Hook / agent gọi Render API (tránh deploy trùng).
#
# Configure the service's public domain in the hosting dashboard and keep the CORS origin list
# below aligned with the actual frontend deployment.
services:
  - type: web
    name: heyganba-backend
    runtime: docker
    plan: free
    region: singapore # đổi sang region khác nếu muốn (oregon / frankfurt / ohio...)
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      # Service production dùng profile `prod`. Profile nạp các migration trong những locations
      # đã cấu hình ở application-prod.yml; xem từng migration và nguồn nội dung trước khi phát hành.
      # Có thể tạo staging riêng với SPRING_PROFILES_ACTIVE=staging.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Render tự sinh secret Base64 256-bit (JJWT HS256 cần ≥ 32 byte sau decode) → không cần điền tay.
      # Nếu đã set giá trị thủ công thì Render giữ nguyên giá trị đó.
      - key: JWT_SECRET
        generateValue: true
      # Replace with the exact browser origins that are currently deployed.
      - key: CORS_ALLOWED_ORIGINS
        value: https://heyganba.site,https://www.heyganba.site
      # Use a PostgreSQL JDBC URL and the TLS options required by the selected provider.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Dùng thông tin đăng nhập migration riêng, có quyền DDL; role runtime không nhận quyền DDL.
      - key: SPRING_FLYWAY_USER
        sync: false
      - key: SPRING_FLYWAY_PASSWORD
        sync: false
      # CIDR peer proxy cần lấy từ cấu hình mạng của nhà cung cấp đang dùng.
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      - key: DEBUG
        value: "false"
      # Múi giờ "ngày học" = giờ VN ở mọi môi trường (quyết định đã chốt) → streak/heatmap reset lúc 00:00 giờ VN.
      - key: APP_STREAK_ZONE
        value: Asia/Ho_Chi_Minh
      # Ngưỡng tính streak trong ngày: >= 10 lượt ôn SRS hoặc 1 bộ quiz/1 lượt thi thử hoặc >= 10 câu ngữ pháp.
      - key: APP_STREAK_MIN_SRS_REVIEWS
        value: "10"
      - key: APP_STREAK_MIN_QUIZ_QUESTIONS
        value: "10"
      # Cache SRS: giữ `memory` (Postgres trực tiếp) — QUYẾT ĐỊNH: chưa bật Redis vì chưa có managed instance.
      # Code cache Redis đã viết sẵn, khi có Redis managed chỉ cần đổi value thành redis + thêm REDIS_HOST/REDIS_PORT.
      - key: APP_SRS_CACHE
        value: memory
