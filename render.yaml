# Blueprint Render cho backend HeyGanba (TUỲ CHỌN).
# - Dùng khi tạo service theo kiểu Blueprint (New → Blueprint → chọn repo). Khi đó Render tự tạo cả PostgreSQL
#   và tự inject `SPRING_DATASOURCE_URL`, giảm thao tác tay xuống chỉ còn `JWT_SECRET`.
# - Không chứa secret: biến `sync: false` phải set trong Render Dashboard (hoặc copy từ backend/.env.example).
# - autoDeploy: false vì deploy do GitHub Actions gọi Deploy Hook (tránh deploy trùng).
#
# DOMAIN: production dùng heyganba.site (Namecheap) →
#   - Frontend (Vercel): apex `heyganba.site` + `www.heyganba.site`
#   - Backend (Render): subdomain `api.heyganba.site`
#     (thêm trong Render Dashboard → service → Settings → Custom Domains sau khi tạo service;
#      cố tình KHÔNG khai báo ở đây để blueprint không phụ thuộc field `domains` và không fail validate)
#   DNS record cụ thể: xem docs/Internal/deployment-plan.md → "Domain heyganba.site".
services:
  - type: web
    name: heyganba-backend
    runtime: docker
    plan: free
    region: singapore # đổi sang region khác nếu muốn (oregon / frankfurt / ohio...)
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      # Service này deploy từ nhánh `main` ⇒ là PRODUCTION: dùng profile `prod` để application-prod.yml
      # chỉ đọc `db/migration` (KHÔNG apply V12/V14 là nội dung chờ duyệt tiếng Nhật).
      # Service staging (nhánh develop) tạo riêng và đặt SPRING_PROFILES_ACTIVE=staging.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Render tự sinh secret Base64 256-bit (JJWT HS256 cần ≥ 32 byte sau decode) → không cần điền tay.
      # Nếu đã set giá trị thủ công thì Render giữ nguyên giá trị đó.
      - key: JWT_SECRET
        generateValue: true
      # Domain thật (Namecheap heyganba.site) — đổi khi domain thay đổi.
      - key: CORS_ALLOWED_ORIGINS
        value: https://heyganba.site,https://www.heyganba.site
      # Database lấy tự động từ Render Postgres khai báo ở `databases:` bên dưới (không cần điền tay).
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: heyganba-postgres
          property: connectionString
      # Múi giờ "ngày học" = giờ VN ở mọi môi trường (quyết định đã chốt) → streak/heatmap reset lúc 00:00 giờ VN.
      - key: APP_STREAK_ZONE
        value: Asia/Ho_Chi_Minh
      # Ngưỡng tính streak trong ngày: >= 10 lượt ôn SRS hoặc 1 bộ quiz/1 lượt thi thử hoặc >= 10 câu ngữ pháp.
      - key: APP_STREAK_MIN_SRS_REVIEWS
        value: "10"
      - key: APP_STREAK_MIN_QUIZ_QUESTIONS
        value: "10"
      # Cache SRS: giữ `memory` (Postgres trực tiếp) — QUYẾT ĐỊNH: chưa bật Redis vì chưa có managed instance.
      # Code cache Redis đã viết sẵn, khi có Redis managed chỉ cần đổi value thành redis + thêm REDIS_HOST/REDIS_PORT.
      - key: APP_SRS_CACHE
        value: memory

# PostgreSQL managed của Render (gói free) — service backend ở trên tự lấy connection string qua `fromDatabase`.
# LƯU Ý gói free: 1 database/workspace, hết hạn sau 30 ngày (Render sẽ thông báo) → khi lên thật nên nâng plan
# hoặc chuyển sang Neon free (xem docs/Internal/deployment-plan.md mục "Staging & Database").
databases:
  - name: heyganba-postgres
    plan: free
    region: singapore
    postgresMajorVersion: "16"
