services:
  postgres:
    image: postgres:16-alpine
    container_name: heyganba-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: heyganba
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heyganba"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: heyganba-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heyganba-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JWT_SECRET: ${JWT_SECRET:?Set a private base64 JWT_SECRET}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: heyganba
      DB_USER: ${DB_USER:?Create the application database role first}
      DB_PASSWORD: ${DB_PASSWORD:?Set the application role password}
      SPRING_FLYWAY_USER: ${SPRING_FLYWAY_USER:?Set the migration owner}
      SPRING_FLYWAY_PASSWORD: ${SPRING_FLYWAY_PASSWORD:?Set the migration owner password}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      # "Ngày học" theo giờ VN ở mọi môi trường (quyết định đã chốt).
      APP_STREAK_ZONE: Asia/Ho_Chi_Minh
      # Cache SRS: giữ memory (Postgres trực tiếp) — Redis chưa bật vì chưa có managed instance.
      APP_SRS_CACHE: memory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
